name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Secret scan (all tracked files)
        run: node tooling/scripts/secret-scan.mjs --all
      - run: npm run -s typecheck
      - run: npx eslint . --max-warnings=0
      - run: npx prettier --check . --log-level warn
      - run: npm run -s test
